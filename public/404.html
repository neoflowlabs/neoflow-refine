<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>NeoFlow Labs</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // This script redirects unknown paths (e.g. /privacy-policy) into the
      // app's index.html so the client-side router (TanStack Router) can
      // pick up the correct route on load.
      var pathSegmentsToKeep = 0; // 0 because this is a custom domain (CNAME), not a github.io/project-name subpath

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
